<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All In One Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #f1f5f9;
            color: #334155;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            max-width: 650px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            color: #0f172a;
            margin-bottom: 8px;
            font-weight: 700;
        }

        p.sub-title {
            font-size: 1.05rem;
            color: #64748b;
            margin-bottom: 30px;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
        }

        .tool-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #ffffff;
            color: #0284c7;
            border: 2px solid #e2e8f0;
            padding: 16px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 600;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease;
        }

        .tool-btn:hover {
            border-color: #0284c7;
            background: #f0f9ff;
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(2, 132, 199, 0.15);
        }

        .tool-btn.highlight {
            border-color: #f59e0b;
            color: #b45309;
            background: #fffbeb;
        }

        .tool-btn.highlight:hover {
            border-color: #d97706;
            background: #fef3c7;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>All In One Tools</h1>
        <p class="sub-title">कृपया वह टूल चुनें जिसका आप उपयोग करना चाहते हैं:</p>

        <div class="tools-grid">
            <!-- Tool 1 -->
            <a href="pdf-to-word.html" class="tool-btn">
                <span>📄</span> PDF to Word Converter
            </a>

            <!-- Tool 2 -->
            <a href="photo-converter.html" class="tool-btn">
                <span>🖼️</span> Photo Converter
            </a>

            <!-- Tool 3 -->
            <a href="compress-pdf.html" class="tool-btn">
                <span>🗜️</span> Compress PDF
            </a>

            <!-- Tool 4 -->
            <a href="bg-remover.html" class="tool-btn">
                <span>✂️</span> Background Remover
            </a>

            <!-- Tool 5 (Bonus: Panchang Link) -->
            <a href="/aaj-ka-panchang/" class="tool-btn highlight" style="grid-column: 1 / -1;">
                <span>🪔</span> आज का पंचांग व चौघड़िया
            </a>
        </div>
    </div>

</body>
</html>
