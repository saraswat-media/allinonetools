<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compress PDF Online - Reduce PDF File Size Free</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

    <header class="bg-green-600 text-white shadow-md">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-arrow-left text-sm"></i> AllInOneTools
            </a>
            <span class="text-sm font-semibold bg-green-700 px-3 py-1 rounded-full">Compress PDF</span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 flex-1 w-full">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-gray-900">Compress PDF Size</h1>
            <p class="text-gray-600 mt-1">PDF फाइल्स को ऑप्टिमाइज़ करके उसका साइज कम करें</p>
        </div>

        <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-200">
            <div id="dropZone" class="border-2 border-dashed border-green-400 bg-green-50/50 rounded-xl p-8 text-center cursor-pointer hover:bg-green-50 transition">
                <i class="fa-solid fa-file-zipper text-4xl text-green-500 mb-3"></i>
                <p class="font-semibold text-gray-700">अपनी PDF फाइल चुनें</p>
                <input type="file" id="fileInput" accept="application/pdf" class="hidden">
            </div>

            <div id="resultBox" class="hidden mt-6 text-center space-y-4">
                <p id="sizeComparison" class="text-sm font-medium text-gray-700"></p>
                <button id="downloadPdfBtn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg shadow transition">
                    <i class="fa-solid fa-download mr-1"></i> Compressed PDF Download करें
                </button>
            </div>
        </div>

        <!-- In-Tool Amazon Banner -->
        <div class="mt-8 p-4 bg-green-50 border border-green-200 rounded-xl flex items-center justify-between">
            <div>
                <p class="text-xs text-green-700 font-bold uppercase tracking-wider">Top Deal</p>
                <p class="text-sm font-semibold text-gray-800">High Capacity External Portable Hard Drives & SSDs</p>
            </div>
            <a href="https://www.amazon.in/s?k=portable+ssd&tag=wwwfbcomrsara-21" target="_blank" rel="nofollow sponsored" 
               class="bg-green-600 text-white text-xs font-bold px-4 py-2 rounded-md hover:bg-green-700 transition">
                Shop on Amazon
            </a>
        </div>
    </main>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const resultBox = document.getElementById('resultBox');
        const sizeComparison = document.getElementById('sizeComparison');
        const downloadPdfBtn = document.getElementById('downloadPdfBtn');

        let compressedBytes = null;

        dropZone.onclick = () => fileInput.click();

        fileInput.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            resultBox.classList.remove('hidden');
            downloadPdfBtn.classList.add('hidden');
            sizeComparison.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> PDF ऑप्टिमाइज़ हो रही है...';

            const originalSizeKb = (file.size / 1024).toFixed(1);
            const arrayBuffer = await file.arrayBuffer();
            const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);

            // Re-saving with compressed objects
            compressedBytes = await pdfDoc.save({ useObjectStreams: true });
            const newSizeKb = (compressedBytes.length / 1024).toFixed(1);

            sizeComparison.innerHTML = `मूल साइज: <b>${originalSizeKb} KB</b> | नया साइज: <b class="text-green-600">${newSizeKb} KB</b>`;
            downloadPdfBtn.classList.remove('hidden');
        };

        downloadPdfBtn.onclick = () => {
            const blob = new Blob([compressedBytes], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'compressed_document.pdf';
            a.click();
        };
    </script>
</body>
</html>
